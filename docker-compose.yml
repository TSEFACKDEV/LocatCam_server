version: "3.8"

services:
  locatcam-db:
    image: postgres:16-alpine
    container_name: locatcam-db
    environment:
      POSTGRES_DB: locatcam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - locatcam_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  locatcam-api:
    build:
      context: ..
      dockerfile: LocatCam_serveur/Dockerfile
    container_name: locatcam-api
    depends_on:
      locatcam-db:
        condition: service_healthy
    ports:
      - "5206:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=locatcam-db;Database=locatcam;Username=postgres;Password=postgres;
      Jwt__SecretKey: LocatCamSuperSecretKeyMin32Chars!!!
      Jwt__Issuer: locatcam.api
      Jwt__Audience: locatcam.mobile
      Jwt__AccessTokenExpirationMinutes: "60"
      Cloudinary__CloudName: dgpt66w4z
      Cloudinary__ApiKey: 715983593278264
      Cloudinary__ApiSecret: o1x6LrZvHXOmlg2hpcNwouZ1B1Y
      Cloudinary__UploadPreset: locatcam_unsigned
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  locatcam_db_data:
